<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c2f66">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="cau-hinh-firebase.js"></script>
<meta name="description" content="Sổ Liên Lạc Của Cô: điểm danh, nhắn phụ huynh qua Zalo, tin nhóm lớp, thư cuối tuần. Miễn phí.">
</head>
<body style="margin:0">
<title>Sổ Liên Lạc Của Cô</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap">
<style>
/* Bố cục: thanh trên chọn lớp đang làm việc; mỗi mục là một việc trong ngày của cô (điểm danh, nhắn, cả lớp, tuần, sổ) */
/* Màu chủ đạo: xanh dương đậm (thanh đầu trang), nền trang xanh rất nhạt, thẻ trắng — tương phản rõ */
:root{
  --bg:#eef3fa; --paper:#ffffff; --ink:#15223a; --muted:#5b6b85; --line:#d9e2f0; --line-strong:#b9c7dc;
  --accent:#1a4f9c; --accent-soft:#e3ecfb; --accent-deep:#0c2f66; --top:#0c2f66; --top-ink:#ffffff; --top-muted:#cfe0ff;
  --warm:#f5a524; --warm-deep:#d98a0c; --warm-ink:#0c2f66; --cream:#ffffff;
  --good:#1a7f4b; --good-soft:#dff3e7; --warn:#a05d07; --warn-soft:#fdf0d8; --bad:#b3261e; --bad-soft:#fbe4e2; --info:#2a5d9f; --info-soft:#e4edf9;
  --f-display:"Lora",Georgia,serif; --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1622; --paper:#182233; --ink:#e7edf7; --muted:#9db0cc; --line:#2a3a52; --line-strong:#3f5273;
  --accent:#6ea4ff; --accent-soft:#1c2f4d; --accent-deep:#4f86e6; --top:#132b52; --top-ink:#ffffff; --top-muted:#a9c3ee;
  --good:#5ccf8f; --good-soft:#15341f; --warn:#e8b45a; --warn-soft:#3a2c14; --bad:#f08a7e; --bad-soft:#3d1c18; --info:#7fb0f0; --info-soft:#1a2a40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1622; --paper:#182233; --ink:#e7edf7; --muted:#9db0cc; --line:#2a3a52; --line-strong:#3f5273;
  --accent:#6ea4ff; --accent-soft:#1c2f4d; --accent-deep:#4f86e6; --top:#132b52; --top-ink:#ffffff; --top-muted:#a9c3ee;
  --good:#5ccf8f; --good-soft:#15341f; --warn:#e8b45a; --warn-soft:#3a2c14; --bad:#f08a7e; --bad-soft:#3d1c18; --info:#7fb0f0; --info-soft:#1a2a40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--top)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(100deg,#07224f 0%,#0c2f66 45%,#0d4182 100%);color:#fff;box-shadow:0 3px 12px rgba(5,20,50,.4);overflow:hidden;border-bottom:3px solid var(--warm)}
.top .scene{position:absolute;right:230px;top:0;height:100%;width:min(520px,55%);pointer-events:none;opacity:.28}
.top .scene svg{height:100%;width:100%}
.top-in{position:relative}
.top .state{color:#fff;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:4px 10px;white-space:nowrap}
.top .hello{color:#fff;font-size:14px}
.top .hello b{color:#fff;text-decoration:underline;text-decoration-color:var(--warm);text-underline-offset:3px}
.top .brand h1{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.top .brand .tag{color:#fff;opacity:1;font-size:14px;font-weight:600;letter-spacing:.01em;text-shadow:0 1px 2px rgba(0,0,0,.35);margin-top:3px}
/* minh họa cô giáo: ảnh ở góc phải, vùng chữ và nút chừa hẳn 230px nên không chồng lên nhau */
.top .people{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:0;height:100%;max-height:150px;width:auto;pointer-events:none;object-fit:contain;object-position:right top}
.top .brand .right{padding-right:230px}
.top nav{padding-right:230px}
@media (max-width:700px){.top .people{height:62px;max-height:62px;right:6px;top:6px}.top .scene{display:none}.top .brand .right,.top nav{padding-right:0}.top .brand .logo{padding-right:110px}}
.top .logo svg{width:48px;height:48px}
.top .logo svg rect:first-child{fill:#fff}
.top .logo svg rect:not(:first-child){fill:var(--top)}
.top .logo svg path{fill:var(--top);stroke:#fff}
.top .logo svg circle{fill:var(--warm)}
.brand h1{font-size:24px}
#lopSel{background:#fff;color:var(--accent-deep);border:1px solid #fff;font-weight:700;border-radius:999px;padding:8px 14px;box-shadow:0 2px 5px rgba(0,0,0,.25)}
/* mục chọn dạng nút bấm: trong mờ viền trắng, mục đang mở trắng đặc */
.top nav{gap:6px;padding-block:10px 12px;margin:0}
.top nav button{color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:9px 16px;font-weight:600}
.top nav button:hover{background:rgba(255,255,255,.22)}
.top nav button.on{background:#fff;color:var(--accent-deep);border-color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.top nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.top-in{max-width:800px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand .logo{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo svg{width:38px;height:38px;flex:none}
.brand h1{font-family:var(--f-display);font-size:19px;margin:0;line-height:1.15}
.brand .tag{font-size:12px;color:var(--muted);display:block;font-family:var(--f-body);font-weight:500}
.brand .state{font-size:12px;color:var(--muted)}
.brand .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hello{font-size:13px;color:var(--muted)}
.hello b{color:var(--ink)}
/* màn hình chào */
.hero{background:linear-gradient(120deg,#07224f,#0c2f66 60%,#0d4182);color:#fff;border-radius:16px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;box-shadow:0 6px 24px rgba(5,25,70,.3);border-bottom:3px solid var(--warm)}
.hero svg{width:64px;height:64px}
.hero svg rect:first-child{fill:#fff}.hero svg rect:not(:first-child){fill:var(--top)}.hero svg path{fill:var(--top);stroke:#fff}.hero svg circle{fill:var(--warm)}
.hero h2{font-family:var(--f-display);font-size:26px;line-height:1.2;text-wrap:balance;color:#fff}
.hero p{margin:0;max-width:52ch;color:#e6eefb}
.hero .btn.primary{background:var(--warm);color:var(--warm-ink);border-color:var(--warm)}
.hero .btn:not(.primary){background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.feat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.feat b{font-size:14px} .feat span{font-size:13px;color:var(--muted)}
#lopSel{width:auto;max-width:100%;font-weight:600;padding:6px 10px;font-size:14px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav::-webkit-scrollbar{display:none}
nav button{font:inherit;font-size:14px;font-weight:500;border:none;background:none;color:var(--muted);padding:8px 10px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{max-width:800px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 1px 2px rgba(20,30,25,.05)}
h2{font-size:16px;margin:0;font-weight:700}
.step{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding-bottom:8px;border-bottom:2px solid var(--accent-soft)}
.note{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.stu:focus-visible,.ev:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.stu{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.stu b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu.on{background:var(--accent-soft);border-color:var(--accent)}
.stu.vang{background:var(--bad-soft);border-color:var(--bad)} .stu.phep{background:var(--warn-soft);border-color:var(--warn)}
.stu .tick{position:absolute;top:6px;right:8px;font-size:12px;font-weight:700;color:var(--accent)}
/* danh sách dọc có ô tích */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:62vh;overflow-y:auto}
.li{display:grid;grid-template-columns:28px 32px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--paper);min-width:0;font:inherit;color:var(--ink);text-align:left;border-left:none;border-right:none;border-top:none;width:100%}
.li:last-child{border-bottom:none}
.li.on{background:var(--accent-soft)}
.li.vang{background:var(--bad-soft)} .li.phep{background:var(--warn-soft)}
.li .stt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.li .box{width:20px;height:20px;border:2px solid var(--line-strong);border-radius:5px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--paper)}
.li.on .box{background:var(--accent);border-color:var(--accent)}
.li .nm{display:flex;flex-direction:column;min-width:0}
.li .nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .nm small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .xtra{font-size:12px;color:var(--muted);white-space:nowrap}
.li .st{display:flex;gap:4px}
.li .st button{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line-strong);background:var(--paper);color:var(--muted);border-radius:6px;padding:4px 7px;cursor:pointer}
.li .st button.on-co{background:var(--good);border-color:var(--good);color:#fff}
.li .st button.on-phep{background:var(--warn);border-color:var(--warn);color:#fff}
.li .st button.on-khong{background:var(--bad);border-color:var(--bad);color:#fff}
.listbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.listbar input{flex:1;min-width:140px}
/* nội dung phản ánh: thanh nhóm + thẻ gọn */
.gtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding-bottom:6px}
.gtabs::-webkit-scrollbar{display:none}
.gtabs button{font:inherit;font-size:13px;font-weight:600;border:none;background:none;color:var(--muted);padding:6px 10px;border-radius:999px;white-space:nowrap;cursor:pointer}
.gtabs button.on{background:var(--accent-deep);color:#fff}
.events{display:flex;flex-wrap:wrap;gap:6px}
.ev{font:inherit;font-size:13.5px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 11px 6px 9px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;line-height:1.25}
.ev .d{width:8px;height:8px;border-radius:50%;flex:none}
.ev.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.ev.on .d{background:#fff}
.d.good{background:var(--good)} .d.warn{background:var(--warn)} .d.bad{background:var(--bad)} .d.info{background:var(--info)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea{line-height:1.5}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line-strong);border-radius:9px;padding:9px 14px;background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{background:var(--bg);border:1px dashed var(--line-strong);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:15px;line-height:1.55}
.msgs{display:flex;flex-direction:column;gap:8px}
.msgbox{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.msgbox .who{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.msgbox .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.msgbox .msg{font-size:14px;padding:10px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.grey{background:var(--bg);color:var(--muted)}
.tbl{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--accent-soft)}
.empty{color:var(--muted);text-align:center;padding:16px 10px;font-size:14px}
.log{display:flex;flex-direction:column;gap:8px}
.log-item{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 10px;border-radius:9px;background:var(--bg);font-size:14px}
.log-item .t{font-size:12px;color:var(--muted);white-space:nowrap}
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media (min-width:640px){.overlay{align-items:center;padding:20px}}
.modal{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{border-radius:14px;padding-bottom:16px}}
.modal h2{display:flex;justify-content:space-between;align-items:center}
.modal .x{font:inherit;border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted);padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90vw}
.err{color:var(--bad);font-size:13px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.zalo{background:#0068ff;border-color:#0068ff;color:#fff}
.btn.zalo:disabled,.btn.zalo.off{background:var(--line);border-color:var(--line);color:var(--muted)}

/* ===== BỐ CỤC THEO MÀN HÌNH ===== */
/* Máy tính rộng: nội dung rộng hơn, các mục chính xếp 2 cột */
.cols{display:flex;flex-direction:column;gap:14px;min-width:0}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:1000px){
  main,.top-in{max-width:1240px}
  .cols{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,1.3fr);align-items:start}
  .cols .col.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 150px)}
  .list{max-height:calc(100vh - 290px)}
  .msgs.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  nav button{font-size:15px;padding:10px 14px}
}
/* Điện thoại: thanh điều hướng dưới đáy, nút to, chữ ngắn */
#navPhone{display:none}
@media (max-width:700px){
  body{font-size:15px}
  #nav{display:none}
  #navPhone{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:fixed;left:0;right:0;bottom:0;z-index:9;background:linear-gradient(180deg,#0d4182,#0c2f66 60%,#07224f);border-top:3px solid var(--warm);box-shadow:0 -4px 16px rgba(5,20,50,.35);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  #navPhone button{font:inherit;font-size:12px;font-weight:600;border:1px solid transparent;background:transparent;color:#fff;border-radius:12px;padding:7px 2px 6px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #navPhone button .ic{width:23px;height:23px}
  #navPhone button:active{background:rgba(255,255,255,.16)}
  #navPhone button.on{background:#fff;color:var(--accent-deep);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #navPhone button.on .ic{color:var(--warm-deep)}
  main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .brand h1{font-size:19px}
  .brand .state,.hello{display:none}
  .top .logo svg{width:36px;height:36px}
  .top-in{padding-block:16px 16px;gap:14px}
  .top .brand h1{font-size:21px}
  .top .brand .right{width:100%;flex-wrap:nowrap}
  .top #lopSel{flex:1;min-width:0;padding:10px 14px;font-size:14px}
  .top .brand .state{display:inline-block;flex:none;font-size:12px;padding:8px 10px;color:#fff;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.6)}
  .top .people{height:72px;max-height:72px}
  .card{padding:12px;border-radius:10px}
  .hero{padding:20px 16px}.hero h2{font-size:22px}
  .ev{font-size:13px;padding:7px 10px 7px 8px}
  .btn{padding:10px 12px}
  .msgbox .who{flex-direction:column;align-items:flex-start}
  .msgbox .who .row{width:100%}
  .msgbox .who .row .btn{flex:1}
  .list{max-height:50vh}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function gioNow(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}

function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function vals(t){return Object.keys(D[t]).map(function(k){var o=Object.assign({},D[t][k]);o.id=k;return o})}

// Gọi con bằng tên đệm + tên ("Nguyễn Nam Anh" → "Nam Anh"). Tên đệm Thị, Văn thì chỉ gọi tên ("Trần Văn Nam" → "Nam").

function tenGoi(h){if(h.biDanh)return h.biDanh;var p=String(h.ten||"").replace(/\([^)]*\)/g," ").trim().split(/\s+/);if(p.length<3)return p[p.length-1]||"";
  var dem=p[p.length-2];return /^(thị|văn)$/i.test(dem)?p[p.length-1]:p.slice(-2).join(" ")}

function hsLop(){return vals("hocsinh").filter(function(h){return h.lop===lopId}).sort(function(a,b){return a.ten.localeCompare(b.ten,"vi")})}
function skLop(){return vals("sukien").filter(function(e){return e.lop===lopId})}

function skById(id){return SUKIEN().filter(function(x){return x.id===id})[0]||SU_KIEN_MAC_DINH.filter(function(x){return x.id===id})[0]||{ten:id,mau:"info",tin:""}}
function copyText(t,okMsg){var ok=function(){toast(okMsg||"Đã sao chép. Mở Zalo và dán.")};var fb=function(){toast("Trình duyệt không cho sao chép tự động, hãy nhấn giữ vào tin và chọn Sao chép.")};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}

/* lưu trữ */
function lsLoad(){try{var s=JSON.parse(localStorage.getItem(LS)||"null");if(s)D=Object.assign(D,s)}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(D));localStorage.setItem(LS+"-sua",new Date().toISOString())}catch(e){toast("Bộ nhớ trình duyệt đã đầy hoặc bị chặn. Cô sao lưu ngay ra tệp nhé.")}}
function save(t,id,obj){D[t][id]=obj;render();
  if(db){var o=Object.assign({},obj);delete o.id;return db.collection(t).doc(id).set(o).catch(function(e){if(e&&e.code==="invalid_argument"){canWrite=false;setState();toast("Bạn chỉ được xem.")}else toast("Chưa lưu được.")})}
  lsSave();return Promise.resolve()}
function remove(t,id){delete D[t][id];render();if(db)return db.collection(t).doc(id).delete().catch(function(){toast("Chưa xóa được.")});lsSave();return Promise.resolve()}
function setState(){var el=$("#stateTxt");el.textContent=canhBaoSaoLuu()?"Nên sao lưu":"Lưu trên máy này";el.className="state tk"+(canhBaoSaoLuu()?" sap":"");el.setAttribute("role","button");el.tabIndex=0;el.onclick=moDuLieu}
async function boot(){
  try{lopId=localStorage.getItem(LS+"-lop")}catch(e){}
  db=null;
  if(db){try{var u=await claude.use("user");if(u){var c=await u.can("data.write");if(c===false)canWrite=false}}catch(e){}
    Object.keys(D).forEach(function(t){db.collection(t).onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});D[t]=m;render()},function(){})})}
  else{lsLoad();render()}
  setState();
}

// Chọn ảnh từ máy, cắt vuông giữa ảnh, thu nhỏ còn 360 điểm ảnh cho nhẹ rồi lưu vào hồ sơ
function chonAnhCo(xong){
  var i=document.createElement("input");i.type="file";i.accept="image/*";
  i.onchange=function(){var f=i.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
      var k=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=360;
      var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,360,360);
      g.drawImage(im,(im.width-k)/2,Math.max(0,(im.height-k)/2-k*0.08),k,k,0,0,360,360);
      var url=c.toDataURL("image/jpeg",0.85);
      save("hoso","hoso",Object.assign({xungHo:"cô",giaoVien:""},hoso(),{anh:url}));
      toast("Đã lưu ảnh của "+(hoso().xungHo||"cô")+".");if(xong)xong()};
      im.onerror=function(){toast("Không đọc được ảnh này, cô chọn ảnh khác nhé.")};im.src=r.result};
    r.readAsDataURL(f)};
  i.click();
}


/* ===== HỌC THÊM: nhóm học thêm gồm một số em trong lớp, điểm danh từng buổi, theo dõi chuyên cần =====
   nhomhoc : {lop, ten, loai, lich:[0..6 là CN..T7], gio, hs:[mã học sinh], batDau, dong}
   buoihoc : {lop, nhom, ngay, ds:[mã em thuộc nhóm lúc điểm danh], vang:{mã:"phep"|"khong"}, noiDung, huy} — mã buổi = mãNhóm_ngày */
var LOAI_HT={phuDao:"Phụ đạo",boiDuong:"Bồi dưỡng",onThi:"Ôn thi",nangKhieu:"Năng khiếu, kỹ năng"};
var TEN_THU=["CN","T2","T3","T4","T5","T6","T7"];
function nhomLop(){return vals("nhomhoc").filter(function(n){return n.lop===lopId&&!n.dong}).sort(function(a,b){return a.ten.localeCompare(b.ten,"vi")})}
function buoiCua(nid){return vals("buoihoc").filter(function(b){return b.nhom===nid}).sort(function(a,b){return a.ngay.localeCompare(b.ngay)})}
function thanhVien(n){var m={};(n.hs||[]).forEach(function(k){m[k]=1});return hsLop().filter(function(h){return m[h.id]})}
function lichChu(n){var l=(n.lich||[]).slice().sort(function(a,b){return (a||7)-(b||7)});return (l.length?l.map(function(d){return TEN_THU[d]}).join(", "):"chưa đặt lịch")+(n.gio?" · "+n.gio:"")}
function coLich(n,ngay){return (n.lich||[]).indexOf(new Date(ngay+"T00:00:00").getDay())>=0}
function nghiChinhKhoa(k,ngay){var dd=D.diemdanh[lopId+"_"+ngay];return dd&&dd.vang?dd.vang[k]:null}
// Những ngày theo lịch (từ ngày bắt đầu đến hôm nay) mà cô chưa điểm danh
function buoiThieu(n){var da={};buoiCua(n.id).forEach(function(b){da[b.ngay]=1});var out=[],d=n.batDau||today(),hn=today(),dem=0;
  if(d<congNgay(hn,-60))d=congNgay(hn,-60);
  while(d<=hn&&dem<400){if(coLich(n,d)&&!da[d])out.push(d);d=congNgay(d,1);dem++}return out}
// Chuyên cần một em trong các buổi (bỏ buổi cô cho nghỉ)
function chuyenCan(k,buois){var r={tong:0,co:0,phep:0,khong:0,chuoi:0,ky:[]};
  buois.forEach(function(b){if(b.huy||(b.ds||[]).indexOf(k)<0)return;r.tong++;var v=(b.vang||{})[k];if(v==="phep")r.phep++;else if(v==="khong")r.khong++;else r.co++;r.ky.push(v||"co")});
  for(var i=r.ky.length-1;i>=0&&r.ky[i]!=="co";i--)r.chuoi++;
  r.tyLe=r.tong?r.co/r.tong:null;r.canYY=r.tong>0&&(r.khong>=2||r.chuoi>=2||(r.tong>=4&&r.tyLe<0.8));return r}
function thangCua(s){return s.slice(0,7)}
function tenThang(t){var p=t.split("-");return "tháng "+(+p[1])+"/"+p[0]}
function dongHocThemTuan(h,tu,den){
  var ds=vals("nhomhoc").filter(function(n){return n.lop===lopId&&(n.hs||[]).indexOf(h.id)>=0});if(!ds.length)return"";
  var phan=ds.map(function(n){var r=chuyenCan(h.id,buoiCua(n.id).filter(function(b){return b.ngay>=tu&&b.ngay<=den}));
    return r.tong?n.ten+" "+r.co+"/"+r.tong+" buổi"+(r.khong?" (vắng không phép "+r.khong+")":r.phep?" (vắng có phép "+r.phep+")":""):""}).filter(Boolean);
  return phan.length?"• Học thêm: "+phan.join("; ")+".\n":""}

/* ===== ĐĂNG NHẬP BẰNG TÀI KHOẢN GOOGLE + ĐỒNG BỘ (Firebase gói Spark, miễn phí hoàn toàn) =====
   Mỗi tài khoản Gmail là đúng một tài khoản trên trang.
   Có tệp cau-hinh-firebase.js thì bật đồng bộ; không có thì trang vẫn chạy, chỉ lưu trên máy.
   Dữ liệu mỗi cô nằm ở nguoiDung/<mã tài khoản>/banGhi/<loại>__<mã bản ghi>; luật bảo mật chỉ cho chính cô đọc ghi. */
var FB=null,NGUOI=null,huyNghe=null,dangDongBo=false,daCapNhatPhien=false;
function coCauHinhMay(){return !!(window.CAU_HINH_FIREBASE&&window.CAU_HINH_FIREBASE.apiKey&&window.firebase)}
function khoiDongMay(){
  if(!coCauHinhMay()){setState();return}
  try{firebase.initializeApp(window.CAU_HINH_FIREBASE)}catch(e){}
  FB=firebase.firestore();
  try{FB.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
  firebase.auth().onAuthStateChanged(function(u){
    NGUOI=u;daCapNhatPhien=false;if(huyNghe){huyNghe();huyNghe=null}
    if(u)batDauDongBo();setState();render();
  });
}
function khoBanGhi(){return FB.collection("nguoiDung").doc(NGUOI.uid).collection("banGhi")}
function sach(o){var x=JSON.parse(JSON.stringify(o));delete x.id;return x}
function batDauDongBo(){
  dangDongBo=true;setState();
  khoBanGhi().get().then(function(snap){
    var tren={};snap.forEach(function(d){tren[d.id]=1});
    // Bản ghi chỉ có trên máy này (ví dụ cô đã dùng trước khi đăng nhập) thì đưa lên tài khoản
    var len=[];Object.keys(D).forEach(function(b){Object.keys(D[b]).forEach(function(id){var k=b+"__"+id;if(!tren[k])len.push([k,{b:b,id:id,v:sach(D[b][id])}])})});
    var lo=[];for(var i=0;i<len.length;i+=400){var bt=FB.batch();len.slice(i,i+400).forEach(function(x){bt.set(khoBanGhi().doc(x[0]),x[1])});lo.push(bt.commit())}
    return Promise.all(lo).then(function(){if(len.length)toast("Đã đưa "+len.length+" bản ghi từ máy này lên tài khoản.")});
  }).then(function(){
    huyNghe=khoBanGhi().onSnapshot(function(snap){
      var moi={};Object.keys(D).forEach(function(k){moi[k]={}});
      snap.forEach(function(d){var x=d.data();if(moi[x.b])moi[x.b][x.id]=x.v});
      Object.keys(moi).forEach(function(k){D[k]=moi[k]});
      luuMayNay();dangDongBo=false;setState();

      if(!snap.metadata.hasPendingWrites)veLaiNheNhang();
    },function(e){dangDongBo=false;setState();toast("Chưa đồng bộ được ("+(e.code||"lỗi")+").")});
  }).catch(function(e){dangDongBo=false;setState();toast("Chưa đồng bộ được, cô kiểm tra mạng.")});
}
// Vẽ lại khi máy khác vừa sửa, nhưng không làm phiền khi cô đang gõ hoặc đang mở hộp thoại

    (typeof trangThaiThamGia==="function"&&coCauHinhMay()?'<div class="detail" style="margin-top:8px"><dl><dt>Chương trình dùng thử</dt><dd>'+trangThaiThamGia()+'</dd></dl></div><div class="row"><button class="btn" id="dlGopY">Góp ý cho sổ</button><button class="btn" id="dlThamGia">'+(tkDongY()==="co"?"Dừng tham gia":"Tham gia dùng thử")+'</button></div><p class="note">Dùng thử chỉ đếm số lần sử dụng, không ghi nội dung tin nhắn, tên học sinh hay số điện thoại phụ huynh.</p>':'')+

  for(var i=0;i<len.length;i+=400){var bt=FB.batch();len.slice(i,i+400).forEach(function(x){bt.set(khoBanGhi().doc(x[0]),x[1])});bt.commit().catch(loiMay)}}

// Xóa sạch: mọi trường, lớp, học sinh, nhật ký, mẫu tin riêng, thông tin cô (cả trên tài khoản nếu đang đồng bộ)

/* ===== CHƯƠNG TRÌNH DÙNG THỬ: ĐẾM MỨC ĐỘ SỬ DỤNG (chỉ đếm số lần, không ghi nội dung) =====
   Đếm: mở sổ, điểm danh, tin riêng gửi phụ huynh, tin nhóm lớp, thư cuối tuần, tin nhắc nộp, lời khen, nhắc nhở...
   KHÔNG ghi: nội dung tin nhắn, tên học sinh, tên hay số điện thoại phụ huynh.
   Số đếm giữ trên máy, chỉ gửi về khi cô đã đăng nhập Google VÀ đồng ý tham gia.
   Lưu ở thongKe/<mã tài khoản>: { ten, truong, email, batDau, lanCuoi, tong:{...}, ngay:{ "2026-10-28":{...} }, khaoSat:{...} } */
var TK_KHOA = LS + "-tk", TK_DONGY = LS + "-tk-dongy";
var TEN_SO_DEM = {
  moSo: "Mở sổ", diemDanh: "Điểm danh", tinRieng: "Tin riêng gửi phụ huynh", tinNhom: "Tin nhóm lớp",
  thuTuan: "Thư cuối tuần", nhacNop: "Tin nhắc nộp", ghiSo: "Lần ghi sổ", soEmGhi: "Lượt em được ghi",
  khen: "Lời khen", nhacNho: "Việc chưa tốt", suKienKhac: "Việc khác", thongBao: "Thông báo theo dõi",
  capNhatDS: "Lần tải danh sách", suaMau: "Lần sửa mẫu tin", hocThem: "Buổi học thêm điểm danh"
};
function tkDoc() { try { return JSON.parse(localStorage.getItem(TK_KHOA)) || { cho: {} } } catch (e) { return { cho: {} } } }
function tkGhi(o) { try { localStorage.setItem(TK_KHOA, JSON.stringify(o)) } catch (e) {} }
function tkDongY() { try { return localStorage.getItem(TK_DONGY) } catch (e) { return null } }
// Cộng thêm n vào một số đếm của hôm nay (giữ trên máy, chờ gửi)
function dem(ten, n) {
  if (tkDongY() === "khong") return;
  n = n || 1; var o = tkDoc(), d = today();
  o.cho[d] = o.cho[d] || {}; o.cho[d][ten] = (o.cho[d][ten] || 0) + n;
  o.ngayDung = o.ngayDung || {}; if (ten !== "moSo") o.ngayDung[d] = 1;
  if (!o.batDau) o.batDau = d;
  tkGhi(o);
}
// Số ngày cô có làm việc với sổ (không tính chỉ mở ra xem)
function soNgayDung() { return Object.keys(tkDoc().ngayDung || {}).length }

/* Nhận biết việc cô vừa làm qua nút được bấm (bắt trước khi trang vẽ lại) */
document.addEventListener("click", function (e) {
  var t = e.target.closest && e.target.closest("button,a"); if (!t) return;
  var trongHop = !!t.closest("#modalRoot");
  if (t.id === "ddLuu") dem("diemDanh");
  else if (t.id === "htLuu") dem("hocThem");
  else if (t.id === "btnGhiGui" || t.id === "btnGhi") { var so = parseInt((t.textContent.match(/\d+/) || ["1"])[0], 10); dem("ghiSo"); dem("soEmGhi", so) }
  else if (t.id === "clCopy" || t.dataset.zalo === "tinNhom") dem("tinNhom");
  else if (t.id === "tbThem") dem("thongBao");
  else if (t.id === "mauThem" || t.dataset.msua) dem("suaMau");
  else if (t.dataset.cp2 || (t.dataset.zalo && trongHop)) dem("nhacNop");
  else if (t.dataset.zalo || t.dataset.cp || t.dataset.gui) dem(tab === "tuan" ? "thuTuan" : "tinRieng");
  else if (trongHop && /^Áp dụng/.test(t.textContent.trim())) dem("capNhatDS");
}, true);

/* Đếm lời khen và việc chưa tốt khi một việc mới được ghi vào sổ */
var saveGoc = save;
save = function (t, id, obj) {
  if (t === "sukien" && !D.sukien[id] && obj) dem(KHEN[obj.loai] ? "khen" : XAU[obj.loai] ? "nhacNho" : "suKienKhac");
  return saveGoc.apply(this, arguments);
};

/* Gửi số đếm về tài khoản */
function khoThongKe() { return FB.collection("thongKe").doc(NGUOI.uid) }
var dangGuiTK = false;
function guiThongKe() {
  if (dangGuiTK || !(NGUOI && FB) || tkDongY() !== "co") return;
  var o = tkDoc(), cho = o.cho || {}, ngays = Object.keys(cho), inc = firebase.firestore.FieldValue.increment;
  var H = hoso(), lop = lopHT && lopHT(), tr = lop ? truongTen(lop.truong) : "";
  var goi = {
    ten: (H.xungHo || "cô") + " " + (H.giaoVien || ""), email: NGUOI.email || "", truong: tr,
    soLop: vals("lop").length, soHocSinh: vals("hocsinh").length, coAnh: !!H.anh,
    thietBi: laDienThoai ? "điện thoại" : "máy tính", batDau: o.batDau || today(),
    lanCuoi: firebase.firestore.FieldValue.serverTimestamp(), dongY: true, ngay: {}, tong: {}
  };
  ngays.forEach(function (d) {
    goi.ngay[d] = {};
    Object.keys(cho[d]).forEach(function (k) { goi.ngay[d][k] = inc(cho[d][k]); goi.tong[k] = inc(tongCho(cho, k)) });
  });
  dangGuiTK = true;
  khoThongKe().get().then(function (s) {
    if (s.exists && s.data().batDau) delete goi.batDau;   // giữ ngày bắt đầu đầu tiên
    return khoThongKe().set(goi, { merge: true });
  }).then(function () {
    var moi = tkDoc(); ngays.forEach(function (d) { delete moi.cho[d] }); tkGhi(moi);
  }).catch(function () {}).then(function () { dangGuiTK = false });
}
function tongCho(cho, k) { return Object.keys(cho).reduce(function (s, d) { return s + (cho[d][k] || 0) }, 0) }
setInterval(guiThongKe, 60000);

function chuKy(){var H=hoso(),L=lopHT()||{};return "— "+hoa(H.xungHo)+" "+H.giaoVien+(L.vaiTro==="bomon"?", giáo viên "+(L.mon||"bộ môn")+" lớp "+L.ten:", chủ nhiệm lớp "+L.ten)+", "+ngayVN(today())}
function soanTin(h,sk,chiTiet,loiCo){
  var H=hoso(),L=lopHT()||{};var ph=xungPH(h);
  var ct=chiTiet?" "+chiTiet.replace(/^[\s,.:]+/,""):"";if(sk.id==="khac")ct=chiTiet||"(chưa ghi)";
  var s=(sk.tin||"").replace(/\{ph\}/g,ph).replace(/\{hs\}/g,"con "+tenGoi(h)).replace(/\{co\}/g,H.xungHo||"cô").replace(/\{ct\}/g,ct).replace(/\{mon\}/g,L.mon||"");
  s=s.replace(/(^|[.!?:]\s+)(mẹ|bố|ông|bà|cô|thầy|phụ huynh)(?=[\s,])/g,function(m,p,w){return p+hoa(w)});
  if(loiCo)s+="\n"+loiCo;
  return s+"\n"+chuKy();
}

/* Mở ỨNG DỤNG Zalo thay vì Zalo web:
   - Điện thoại: zalo.me/<số> tự mở ứng dụng nếu đã cài.
   - Máy tính: gọi giao thức zalo:// để bật Zalo PC; nếu sau 1,5 giây không có gì xảy ra (chưa cài, hoặc trình duyệt chặn) thì mở Zalo web để không bị kẹt. */
function moZalo(webUrl){
  var m=webUrl.match(/zalo\.me\/(\d+)$/);
  if(laDienThoai||!m){window.open(webUrl,"_blank","noopener");return}
  var so=m[1];if(so.indexOf("84")===0)so="0"+so.slice(2);
  var app="zalo://conversation?phone="+so;
  var roi=false;var an=function(){roi=true};
  document.addEventListener("visibilitychange",an,{once:true});window.addEventListener("blur",an,{once:true});
  var f=document.createElement("iframe");f.style.display="none";f.src=app;document.body.appendChild(f);
  setTimeout(function(){f.remove();document.removeEventListener("visibilitychange",an);window.removeEventListener("blur",an);
    if(!roi&&!document.hidden)window.open(webUrl,"_blank","noopener")},1500);
}

  toast("Đã sao chép tin. Trong Zalo, nhấn giữ ô nhập và chọn Dán.");if(a.dataset.sk)daGui(a.dataset.sk);
  if(!laDienThoai&&/zalo\.me\/\d+$/.test(a.href)){ev.preventDefault();moZalo(a.href)}
}})}

/* ===== THƯ CUỐI TUẦN ===== */
function rTuan(){
  var H=hoso(),L=lopHT();var hs=hsLop();
  var den=rTuan.den||today();var tu=congNgay(den,-6);
  var evs=skLop().filter(function(e){return e.ngay>=tu&&e.ngay<=den});
  var dds=vals("diemdanh").filter(function(d){return d.lop===lopId&&d.ngay>=tu&&d.ngay<=den});
  function thu(h){
    var mine=evs.filter(function(e){return e.hs===h.id});var vangP=0,vangK=0;dds.forEach(function(d){var v=(d.vang||{})[h.id];if(v==="phep")vangP++;if(v==="khong")vangK++});
    var khen=mine.filter(function(e){return KHEN[e.loai]}),xau=mine.filter(function(e){return XAU[e.loai]});
    var s=hoa(xungPH(h))+" ơi, "+H.xungHo+" gửi tóm tắt tuần "+ngayVN(tu)+" – "+ngayVN(den)+" của con "+tenGoi(h)+":\n";
    s+="• Chuyên cần: "+(vangP+vangK?(vangP?"nghỉ có phép "+vangP+" buổi":"")+(vangP&&vangK?", ":"")+(vangK?"nghỉ không phép "+vangK+" buổi":""):"đi học đầy đủ")+".\n"+dongHocThemTuan(h,tu,den);
    if(khen.length)s+="• Điểm sáng: "+khen.map(function(e){return (e.chiTiet||"được "+H.xungHo+" khen").replace(/^[\s,.:]+/,"")}).join("; ")+".\n";

/* ===== CẬP NHẬT DANH SÁCH TỪ TRANG TÍNH CỦA TRƯỜNG =====
   Nhận: tệp Excel/CSV tải từ Google Trang tính, hoặc nội dung sao chép dán.
   Tự nhận cột theo tiêu đề; so khớp theo họ tên trong lớp; chỉ thêm mới / sửa đổi, không tạo trùng. */
var COT=[ // {ma, nhan, tu khoa nhận dạng tiêu đề}
  {ma:"ten",nhan:"Họ tên học sinh",tk:["họ và tên","họ tên","ho ten","học sinh","tên học sinh","hoc sinh","họ, tên","full name"]},
  {ma:"ngaySinh",nhan:"Ngày sinh",tk:["ngày sinh","ngay sinh","sinh ngày","ns"]},
  {ma:"biDanh",nhan:"Tên gọi ở nhà",tk:["tên gọi","tên thường gọi","biệt danh","gọi ở nhà"]},
  {ma:"me",nhan:"Họ tên mẹ",tk:["họ tên mẹ","tên mẹ","mẹ"]},
  {ma:"sdtMe",nhan:"Điện thoại mẹ",tk:["sđt mẹ","số điện thoại mẹ","điện thoại mẹ","đt mẹ","sdt me"]},
  {ma:"bo",nhan:"Họ tên bố",tk:["họ tên bố","tên bố","bố","cha","họ tên cha"]},
  {ma:"sdtBo",nhan:"Điện thoại bố",tk:["sđt bố","số điện thoại bố","điện thoại bố","đt bố","sdt bo","sđt cha"]},
  {ma:"phuHuynh",nhan:"Phụ huynh (chung)",tk:["phụ huynh","họ tên phụ huynh","người giám hộ","cha mẹ","phu huynh"]},
  {ma:"sdt",nhan:"Điện thoại (chung)",tk:["số điện thoại","điện thoại","sđt","sdt","đt","zalo","liên hệ","phone"]},
  {ma:"diaChi",nhan:"Địa chỉ",tk:["địa chỉ","nơi ở","dia chi","thường trú","hộ khẩu"]},
  {ma:"lop",nhan:"Lớp",tk:["lớp","lop","class"]},
  {ma:"bo_qua",nhan:"(bỏ qua cột này)",tk:[]}
];
function chuan(s){return String(s||"").toLowerCase().replace(/\s+/g," ").trim()}
/* Nhận cột theo tiêu đề. Cột chứa CCCD, định danh, nghề nghiệp, năm sinh của bố mẹ... luôn bị bỏ qua,
   chỉ cột thật sự là tên / số điện thoại của bố mẹ mới được lấy. */
var CO_PH_ME=/(mẹ|\bme\b)/, CO_PH_BO=/(bố|\bbo\b|\bcha\b)/;
var LA_DT=/(sđt|\bsdt\b|điện thoại|dien thoai|di động|di dong|(^|\s)đt(\s|$)|zalo|phone)/;
var BO_QUA_TD=/(cccd|cmnd|căn cước|can cuoc|định danh|dinh danh|hộ chiếu|nghề|nghe nghiep|công việc|năm sinh|nam sinh|email|dân tộc|tôn giáo|giới tính|tài khoản|ghi chú|stt|số thứ tự|mã học sinh|mã hs)/;
function doanCot(tieuDe){
  var t=chuan(tieuDe);if(!t)return"bo_qua";
  var laDT=LA_DT.test(t);
  if(BO_QUA_TD.test(t)&&!laDT)return"bo_qua";
  var me=CO_PH_ME.test(t),bo=CO_PH_BO.test(t);
  if(laDT){if(me&&!bo)return"sdtMe";if(bo&&!me)return"sdtBo";return"sdt"}
  if(/sinh/.test(t)){return(me||bo)?"bo_qua":"ngaySinh"}
  if(me&&!bo&&/(họ|tên|ho ten|^mẹ$|^me$|mẹ học sinh)/.test(t))return"me";
  if(bo&&!me&&/(họ|tên|ho ten|^bố$|^cha$|^bo$)/.test(t))return"bo";
  if(me||bo){if(/(phụ huynh|cha mẹ|bố mẹ|giám hộ)/.test(t))return"phuHuynh";return"bo_qua"}
  if(/(phụ huynh|giám hộ|phu huynh)/.test(t))return"phuHuynh";
  if(/(tên gọi|biệt danh|gọi ở nhà)/.test(t))return"biDanh";
  if(/(họ và tên|họ tên|ho ten|ho va ten|tên học sinh|học sinh|^tên$|full name)/.test(t))return"ten";
  if(/(địa chỉ|dia chi|nơi ở|thường trú|hộ khẩu|chỗ ở)/.test(t))return"diaChi";
  if(/^(lớp|lop|class)\b/.test(t))return"lop";
  return"bo_qua";
}
/* Rút số điện thoại từ một ô ("0912.345.678", "+84 912 345 678", "Mẹ: 0912345678 / Bố: 0988...") — lấy số đầu tiên hợp lệ */
function layDT(v){var m=String(v||"").replace(/[.\-\s()]/g,"").match(/(\+?84|0)(3|5|7|8|9)\d{8}/);if(!m)return"";var d=m[0].replace(/^\+?84/,"0");return d}
function laSoGiayTo(v){var d=String(v||"").replace(/\s/g,"");return /^\d{12}$/.test(d)||/^\d{9}$/.test(d)}
/* Kiểm tra lại bằng nội dung cột: cột gán là điện thoại nhưng toàn số CCCD thì bỏ; cột tên nhưng toàn chữ số thì bỏ;
   cột chưa nhận ra mà toàn số điện thoại thì nhận là số điện thoại. Mỗi loại thông tin chỉ giữ một cột. */
function soatCot(map,duLieu){
  var mau=duLieu.slice(0,40);
  function tyLe(i,f){var c=0,n=0;mau.forEach(function(r){var v=String(r[i]||"").trim();if(!v)return;n++;if(f(v))c++});return n?c/n:0}
  var kq=map.map(function(m,i){
    if(/^sdt/.test(m)&&tyLe(i,laSoGiayTo)>0.5)return"bo_qua";
    if(/^(me|bo|phuHuynh|ten)$/.test(m)&&tyLe(i,function(v){return /^\+?[\d\s.\-]+$/.test(v)})>0.5)return"bo_qua";
    return m});
  if(kq.indexOf("sdt")<0&&kq.indexOf("sdtMe")<0&&kq.indexOf("sdtBo")<0)
    kq=kq.map(function(m,i){return m==="bo_qua"&&tyLe(i,function(v){return !!layDT(v)&&String(v).replace(/\D/g,"").length<=12})>0.6?"sdt":m});
  var da={};return kq.map(function(m){if(m==="bo_qua")return m;if(da[m])return"bo_qua";da[m]=1;return m});
}
function docBang(rows){ // rows: mảng các mảng ô. Tìm dòng tiêu đề (dòng có >=2 ô khớp từ khóa), trả {tieuDe, duLieu}
  var best=-1,bestN=0;
  for(var i=0;i<Math.min(rows.length,15);i++){var n=rows[i].filter(function(c){return doanCot(c)!=="bo_qua"}).length;if(n>bestN){bestN=n;best=i}}
  if(best<0||bestN<1)return{tieuDe:null,duLieu:rows};
  return{tieuDe:rows[best].map(function(c){return String(c||"")}),duLieu:rows.slice(best+1)};
}
/* Đổi đường dẫn Google Trang tính thành đường đọc dữ liệu dạng CSV (đọc đúng tab theo gid trong đường dẫn) */
function duongDanCsv(u){
  var m=String(u).match(/docs\.google\.com\/spreadsheets\/d\/(e\/)?([a-zA-Z0-9_-]{20,})/);if(!m)return null;
  var g=String(u).match(/[#&?]gid=(\d+)/);
  if(m[1])return"https://docs.google.com/spreadsheets/d/e/"+m[2]+"/pub?output=csv"+(g?"&gid="+g[1]:"");
  return"https://docs.google.com/spreadsheets/d/"+m[2]+"/gviz/tq?tqx=out:csv"+(g?"&gid="+g[1]:"");
}
/* Đọc CSV có dấu ngoặc kép, dấu phẩy và xuống dòng trong ô */
function docCsv(t){
  var rows=[],row=[],o="",q=false;t=t.replace(/^\ufeff/,"");
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){o+='"';i++}else q=false}else o+=c}
    else if(c==='"')q=true;else if(c===","){row.push(o);o=""}else if(c==="\n"){row.push(o);rows.push(row);row=[];o=""}else if(c!=="\r")o+=c}
  if(o||row.length){row.push(o);rows.push(row)}
  return rows;
}
/* ===== NHẬP DANH SÁCH TỪ BẢNG: phần dùng chung cho nhập tay và tự cập nhật ===== */
function layBanMap(map,r){var o={};map.forEach(function(m,i){if(m==="bo_qua"||o[m]||r[i]==null)return;var v=String(r[i]).trim();if(!v)return;if(/^sdt/.test(m)){v=layDT(v);if(!v)return}o[m]=v});return o}
function thanhHSLop(o,cu,lopX){
    var h=Object.assign({lop:lopX,ten:"",biDanh:"",quanHe:"mẹ",phuHuynh:"",sdt:"",diaChi:"",ngaySinh:"",lienHe2:""},cu||{});
    h.ten=o.ten||h.ten;if(o.ngaySinh)h.ngaySinh=o.ngaySinh;if(o.biDanh)h.biDanh=o.biDanh;if(o.diaChi)h.diaChi=o.diaChi;
    var me=o.me,bo=o.bo,sm=o.sdtMe,sb=o.sdtBo;
    if(me||bo||sm||sb){
      // ưu tiên người có số điện thoại; cả hai đều có thì chọn mẹ
      var chonMe=sm?true:(sb?false:!!me);
      if(chonMe){h.quanHe="mẹ";h.phuHuynh=me||h.phuHuynh;h.sdt=sm||o.sdt||h.sdt;h.lienHe2=(bo||sb)?("bố "+(bo||"")+(sb?" "+sb:"")).replace(/\s+/g," ").trim():h.lienHe2}
      else{h.quanHe="bố";h.phuHuynh=bo||h.phuHuynh;h.sdt=sb||o.sdt||h.sdt;h.lienHe2=(me||sm)?("mẹ "+(me||"")+(sm?" "+sm:"")).replace(/\s+/g," ").trim():h.lienHe2} }
    else if(o.phuHuynh){var mm=o.phuHuynh.match(/^(mẹ|bố|ông|bà|cha|phụ huynh)\s*[:\-]?\s*(.+)/i);if(mm){h.quanHe=mm[1].toLowerCase()==="cha"?"bố":mm[1].toLowerCase();h.phuHuynh=mm[2]}else h.phuHuynh=o.phuHuynh;if(o.sdt)h.sdt=o.sdt}
    else if(o.sdt)h.sdt=o.sdt;
    return h;
}
/* Mã cố định cho em mới thêm từ bảng (theo lớp + họ tên): hai máy cùng tự cập nhật một lúc cũng không tạo trùng */
function maHocSinh(lopX,ten){var s=lopX+"|"+chuan(ten),h=5381;for(var i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return"hs_"+h.toString(36)+"_"+s.length}
/* Ghép cột: dùng cách ghép cô đã chỉnh lần trước (nếu có), cột mới thì để máy tự nhận */
function anhXaCot(tieuDe,duLieu,cotLuu){
  var map=tieuDe.map(function(h){var k=String(h||"").trim();return cotLuu&&cotLuu[k]!==undefined?cotLuu[k]:doanCot(h)});
  return cotLuu&&Object.keys(cotLuu).length?map:soatCot(map,duLieu);
}
/* So bảng với danh sách hiện có của một lớp: em mới, em đổi thông tin, em không còn trong bảng */
function tinhThayDoi(duLieu,map,L,lamMoi){
  var tenLop=chuan(L.ten),boQuaLop=0,hsLopX=vals("hocsinh").filter(function(h){return h.lop===L.id});
  var hsCu={};hsLopX.forEach(function(h){hsCu[chuan(h.ten)]=h});
  var them=[],sua=[],giu=0,thay={};
  duLieu.forEach(function(r){var o=layBanMap(map,r);if(!o.ten||/^\d+$/.test(o.ten))return;
    if(o.lop&&tenLop&&chuan(o.lop)!==tenLop&&chuan(o.lop).replace(/^lớp\s*/,"")!==tenLop.replace(/^lớp\s*/,"")){boQuaLop++;return}
    var k=chuan(o.ten);if(thay[k])return;thay[k]=1;var cu=hsCu[k];
    if(!cu){var hm=thanhHSLop(o,null,L.id);hm.id=maHocSinh(L.id,o.ten);them.push(hm);return}
    // Làm mới hoàn toàn: dựng lại thông tin em từ bảng (bỏ hết thông tin cũ), chỉ giữ mã em để không mất nhật ký
    var moi=lamMoi?thanhHSLop(o,{lop:L.id},L.id):thanhHSLop(o,cu,L.id);delete moi.id;
    var doi=["ten","ngaySinh","biDanh","quanHe","phuHuynh","sdt","diaChi","lienHe2"].filter(function(f){return (moi[f]||"")!==(cu[f]||"")});
    if(doi.length)sua.push({id:cu.id,cu:cu,moi:moi,doi:doi});else giu++});
  var thieu=hsLopX.filter(function(h){return !thay[chuan(h.ten)]});
  return{them:them,sua:sua,giu:giu,thieu:thieu,boQuaLop:boQuaLop};
}
/* Lưu cách ghép cột theo tiêu đề để lần tự cập nhật sau dùng lại */
function cotDeLuu(tieuDe,map){var o={};(tieuDe||[]).forEach(function(h,i){var k=String(h||"").trim();if(k)o[k]=map[i]||"bo_qua"});return o}
function docTrangTinh(link){
  var dc=duongDanCsv(link);if(!dc)return Promise.reject(new Error("link_sai"));
  return fetch(dc,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.text()}).then(function(t){
    if(/^\s*</.test(t))throw new Error("khong_cong_khai");
    var rows=docCsv(t).filter(function(r){return r.some(function(c){return String(c).trim()})});
    if(!rows.length)throw new Error("trong");return rows});
}
/* TỰ CẬP NHẬT mỗi khi mở trang: lớp nào đã lưu đường dẫn trang tính thì đọc lại, thêm em mới, sửa thông tin đổi.
   Không tự xóa em nào (em không còn trong bảng chỉ được báo lại để cô tự quyết). */

  if(tcDang||!canWrite)return;var lops=vals("lop").filter(function(l){return l.linkTrangTinh});
  if(!lops.length)return;tcDang=true;tcLanCuoi=Date.now();var bao=[],loi=[];
  Promise.all(lops.map(function(L){
    return docTrangTinh(L.linkTrangTinh).then(function(rows){
      var b=docBang(rows);if(!b.tieuDe)return;var map=anhXaCot(b.tieuDe,b.duLieu,L.cotTrangTinh);if(map.indexOf("ten")<0)return;
      var d=tinhThayDoi(b.duLieu,map,L,false);
      d.them.forEach(function(h){var id=h.id;delete h.id;save("hocsinh",id,h)});d.sua.forEach(function(x){save("hocsinh",x.id,x.moi)});

      if(d.thieu.length)bao.push("lớp "+L.ten+" có "+d.thieu.length+" em không còn trong bảng");
    }).catch(function(){loi.push(L.ten)});
  })).then(function(){tcDang=false;
    if(bao.length)toast("Đã cập nhật từ trang tính · "+bao.join(" · "));
    else if(loi.length)toast("Chưa đọc được trang tính của lớp "+loi.join(", ")+". Cô kiểm tra mạng hoặc quyền chia sẻ.");
  });
}

/* ===== hộp thoại chung ===== */
function modal(title,body,btns){
  var r=$("#modalRoot");r.innerHTML='<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true"><h2>'+title+'<button class="x" id="mx" aria-label="Đóng">×</button></h2>'+body+'<div class="row" style="justify-content:flex-end" id="mb"></div></div></div>';
  var mb=$("#mb");btns.forEach(function(b){var el=document.createElement("button");el.className="btn "+(b.cls||"");el.textContent=b.t;el.onclick=function(){if(b.fn)b.fn();if(!b.keep)closeModal()};mb.appendChild(el)});
  $("#mx").onclick=closeModal;$("#ov").addEventListener("click",function(e){if(e.target.id==="ov")closeModal()});var f=r.querySelector("input,textarea,select");if(f)f.focus();
}
function closeModal(){$("#modalRoot").innerHTML=""}
function xacNhan(msg,fn){var r=document.createElement("div");r.innerHTML='<div class="overlay" style="z-index:25"><div class="modal" style="max-width:420px"><p>'+esc(msg)+'</p><div class="row" style="justify-content:flex-end"><button class="btn" id="xcN">Không</button><button class="btn danger" id="xcY">Xóa</button></div></div></div>';document.body.appendChild(r);$("#xcN",r).onclick=function(){r.remove()};$("#xcY",r).onclick=function(){r.remove();fn()}}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
